name: Scan Kalshi paper markets
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: paper-market-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan public markets
        run: |
          python scanner.py
          python paper_engine.py
      - name: Independent weather ensemble research
        run: |
          python weather_research.py
          python weather_matcher.py
      - name: Save newest market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_markets.csv data/status.json data/paper_trades.csv data/weather_research.csv data/weather_candidates.csv docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update paper market watchlist"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to publish snapshot after 3 attempts"
                exit 1
              fi
              sleep 3
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
